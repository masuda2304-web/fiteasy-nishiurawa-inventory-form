<script src="assets/app.js"></script>
<script>
  mountStatusBar();

  function windowText() {
    const m = nowMinutesOfDay();
    const w1s = 12 * 60 + 30, w1e = 13 * 60;
    const w2s = 18 * 60 + 30, w2e = 19 * 60 + 30;
    if (m >= w1s && m <= w1e) return "実施中 12:30-13:00";
    if (m >= w2s && m <= w2e) return "実施中 18:30-19:30";
    if (m < w1s) return "次回 12:30〜";
    if (m < w2s) return "次回 18:30〜";
    return "本日終了(次回 12:30〜)";
  }

  async function loadStats() {
    document.getElementById("stat-window").textContent = windowText();
    setInterval(() => {
      document.getElementById("stat-window").textContent = windowText();
    }, 30000);

    const cfg = getConfig();
    if (!cfg) {
      document.getElementById("stat-items").textContent = "-";
      document.getElementById("stat-today").textContent = "-";
      return;
    }
    try {
      const { data: itemsData } = await ghGetJson(cfg, "data/items.json");
      document.getElementById("stat-items").textContent = (itemsData.items || []).length + "件";
    } catch (e) {
      document.getElementById("stat-items").textContent = "-";
    }
    try {
      const files = await ghListDir(cfg, "data/counts");
      const today = todayDateStr();
      const count = files.filter((f) => f.name.startsWith(today)).length;
      document.getElementById("stat-today").textContent = count + " / 2";
    } catch (e) {
      document.getElementById("stat-today").textContent = "-";
    }
  }

  loadStats();
</script>
