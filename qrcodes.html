<title>QRコード一覧 | フィットイージー西浦和店 備品管理</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="assets/style.css" />

<header>
  <h1>QRコード一覧(印刷用)</h1>
  <div class="sub">切り取って、対応する棚のラベルに貼り付けてください</div>
</header>

<main>
  <a class="back no-print" href="index.html">← メニューに戻る</a>
  <button class="menu-btn secondary no-print" id="print-btn">この画面を印刷する</button>

  <div class="card no-print">
    <p style="font-size:13px; color:#666; margin:0;">
      品目を追加・変更した場合は、リポジトリ内の <code>generate_qr_codes.py</code> を実行して
      QR画像を再生成してください(手順書を参照)。
    </p>
  </div>

  <div id="list"></div>
</main>

<script src="assets/app.js"></script>
<script>
  async function init() {
    const cfg = requireConfigOrRedirect();
    if (!cfg) return;

    const listEl = document.getElementById("list");
    try {
      const { data: itemsData } = await ghGetJson(cfg, "data/items.json");
      const items = (itemsData.items || []).filter((it) => it.requires_qr);

      if (items.length === 0) {
        listEl.innerHTML = "<p>QR対象の品目がありません。</p>";
        return;
      }

      const cacheBust = Date.now();
      listEl.innerHTML = items
        .map(
          (it) => `
        <div class="qr-card">
          <img src="assets/qrcodes/${it.id}.png?v=${cacheBust}" alt="${it.name}のQRコード" />
          <div class="meta">
            <strong>${it.name}</strong>(${it.unit})<br />
            <span class="min">棚: ${it.shelf || "-"} / 最低在庫: ${it.min_stock ?? "-"}${it.unit}</span><br />
            <span class="min">ID: ${it.id}</span>
          </div>
        </div>`
        )
        .join("");
    } catch (e) {
      listEl.innerHTML = `<p style="color:#c0392b">読み込みに失敗しました: ${e.message}</p>`;
    }
  }

  document.getElementById("print-btn").addEventListener("click", () => window.print());
  init();
</script>
