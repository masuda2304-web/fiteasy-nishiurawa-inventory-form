<title>設定 | フィットイージー西浦和店 備品管理</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="assets/style.css" />

<header>
  <h1>設定(アクセストークン登録)</h1>
  <div class="sub">最初の1回だけ、この端末に登録してください</div>
</header>

<main>
  <a class="back" href="index.html">← メニューに戻る</a>

  <div class="card">
    <p style="margin-top:0;">
      店長から共有された「GitHubユーザー名」「データリポジトリ名」「アクセストークン」を
      入力して保存してください。一度保存すれば、次回からこの画面を開く必要はありません。
      入力内容はこの端末のブラウザ内にのみ保存され、外部には送信されません。
    </p>

    <label for="owner">GitHubユーザー名(データリポジトリのオーナー)</label>
    <input type="text" id="owner" placeholder="例: masuda2304" />

    <label for="repo">データリポジトリ名</label>
    <input type="text" id="repo" placeholder="例: fiteasy-nishiurawa-inventory-data" />

    <label for="token">アクセストークン(Fine-grained personal access token)</label>
    <input type="password" id="token" placeholder="github_pat_xxxxxxxx" />

    <button class="menu-btn" id="save-btn">保存する</button>
    <button class="menu-btn secondary" id="test-btn">接続テスト</button>

    <div id="msg"></div>
  </div>
</main>

<script src="assets/app.js"></script>
<script>
  const ownerEl = document.getElementById("owner");
  const repoEl = document.getElementById("repo");
  const tokenEl = document.getElementById("token");
  const msgEl = document.getElementById("msg");

  (function fillFromSaved() {
    const cfg = getConfig();
    if (cfg) {
      ownerEl.value = cfg.owner;
      repoEl.value = cfg.repo;
      tokenEl.value = cfg.token;
    }
  })();

  function showMsg(text, type) {
    msgEl.innerHTML = `<div class="notice ${type}">${text}</div>`;
  }

  function currentValues() {
    return {
      owner: ownerEl.value.trim(),
      repo: repoEl.value.trim(),
      token: tokenEl.value.trim(),
    };
  }

  document.getElementById("save-btn").addEventListener("click", () => {
    const { owner, repo, token } = currentValues();
    if (!owner || !repo || !token) {
      showMsg("すべての項目を入力してください。", "error");
      return;
    }
    saveConfig(owner, repo, token);
    showMsg("保存しました。", "ok");
  });

  document.getElementById("test-btn").addEventListener("click", async () => {
    const { owner, repo, token } = currentValues();
    if (!owner || !repo || !token) {
      showMsg("すべての項目を入力してください。", "error");
      return;
    }
    showMsg("接続確認中...", "warn");
    try {
      const { data } = await ghGetJson({ owner, repo, token }, "data/items.json");
      const count = (data.items || []).length;
      showMsg(`接続に成功しました。品目数: ${count}件`, "ok");
    } catch (e) {
      showMsg(`接続に失敗しました: ${e.message}`, "error");
    }
  });
</script>
