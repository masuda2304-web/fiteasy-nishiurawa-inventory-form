<title>持ち出し・使用の登録 | フィットイージー西浦和店 備品管理</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="assets/style.css" />

<header>
  <h1>持ち出し・使用の登録</h1>
  <div class="sub">備品を持ち出した/使用したら、その場ですぐに登録してください</div>
</header>

<main>
  <a class="back" href="index.html">← メニューに戻る</a>

  <div class="card" id="form-card">
    <p>読み込み中...</p>
  </div>
</main>

<script src="assets/app.js"></script>
<script>
  async function init() {
    const cfg = requireConfigOrRedirect();
    if (!cfg) return;

    const card = document.getElementById("form-card");
    const params = new URLSearchParams(location.search);
    const presetItemId = params.get("item");

    try {
      const [{ data: staffData }, { data: itemsData }] = await Promise.all([
        ghGetJson(cfg, "data/staff.json"),
        ghGetJson(cfg, "data/items.json"),
      ]);

      const items = (itemsData.items || []).filter((it) => it.requires_qr);
      const preset = items.find((it) => it.id === presetItemId);

      let itemFieldHtml;
      if (preset) {
        itemFieldHtml = `
          <label>品目</label>
          <input type="text" value="${preset.name}(${preset.unit})" disabled />
          <input type="hidden" id="item-id" value="${preset.id}" />
        `;
      } else {
        itemFieldHtml = `
          <label for="item-id">品目</label>
          <select id="item-id">
            ${items.map((it) => `<option value="${it.id}">${it.name}(${it.unit})</option>`).join("")}
          </select>
        `;
      }

      card.innerHTML = `
        ${itemFieldHtml}
        <label for="qty">持ち出し・使用した数量</label>
        <input type="number" id="qty" inputmode="numeric" min="1" step="1" value="1" />

        <label for="staff">担当者</label>
        <select id="staff">
          ${(staffData.staff || []).map((s) => `<option value="${s}">${s}</option>`).join("")}
        </select>

        <button class="primary" id="submit-btn">登録する</button>
        <div class="status" id="status" hidden></div>
      `;

      document.getElementById("submit-btn").addEventListener("click", async () => {
        const itemIdEl = document.getElementById("item-id");
        const itemId = itemIdEl.value;
        const qty = Number(document.getElementById("qty").value);
        const staff = document.getElementById("staff").value;
        const statusEl = document.getElementById("status");
        const btn = document.getElementById("submit-btn");

        if (!itemId || !qty || qty <= 0) {
          showStatus(statusEl, "品目と数量を正しく入力してください。", true);
          return;
        }

        btn.disabled = true;
        showStatus(statusEl, "登録中...", false);

        const payload = {
          timestamp: nowIsoJst(),
          item_id: itemId,
          qty,
          staff,
        };

        const tsForName = payload.timestamp.replace(/[:+]/g, "").replace(".", "");
        const filename = `data/checkouts/${tsForName}_${itemId}-${randSuffix()}.json`;

        try {
          await ghCreateJson(cfg, filename, payload, `持ち出し登録: ${itemId} x${qty} (${staff})`);
          showStatus(statusEl, "登録しました。ありがとうございました。", false);
        } catch (e) {
          showStatus(statusEl, "登録に失敗しました: " + e.message, true);
          btn.disabled = false;
        }
      });
    } catch (e) {
      card.innerHTML = `<p style="color:#c0392b">読み込みに失敗しました: ${e.message}</p>`;
    }
  }

  init();
</script>
